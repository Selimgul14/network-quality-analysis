# Local dev stack: reference server + Timescale + backend + Grafana.
# Lets you build the whole pipeline without the Pi or Azure.
services:
  reference:
    build: ./reference
    ports: ["8080:80"]

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: wifi
      POSTGRES_PASSWORD: wifi
      POSTGRES_DB: wifi
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi -d wifi"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    environment:
      API_INGEST_TOKEN: dev-token-change-me
      API_DATABASE_URL: postgresql+psycopg://wifi:wifi@db:5432/wifi
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy   # don't run migrations before Postgres is up
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      # defaults target the local compose DB; override in .env to point
      # Grafana at the Azure DB instead (see infra/README.md)
      DB_HOST: ${GRAFANA_DB_HOST:-db}
      DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-wifi}
      DB_SSLMODE: ${GRAFANA_DB_SSLMODE:-disable}
    volumes: ["./dashboard/grafana:/etc/grafana/provisioning"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
