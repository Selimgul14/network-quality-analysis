<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiFi health</title>
  <style>
    /* Same palette as the detailed page, far less of it. */
    :root { --ink:#1b2733; --mute:#65788a; --faint:#8b9cab; --line:#e3e9ef; --track:#eef2f6;
            --green:#1f9d57; --amber:#d98a00; --red:#d23b3b; }
    * { box-sizing:border-box; }
    body { font-family:system-ui, -apple-system, sans-serif; margin:0; background:#eef2f6;
           color:var(--ink); -webkit-font-smoothing:antialiased; }
    main { max-width:600px; margin:2.5rem auto; padding:0 1rem; }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px;
            padding:2rem 2rem 1.6rem; }
    .eyebrow { text-align:center; font-size:.72rem; letter-spacing:.09em; text-transform:uppercase;
               color:var(--faint); margin:0 0 .35rem; }
    h1 { text-align:center; font-size:1.3rem; font-weight:650; margin:0 0 1.4rem; }

    /* Gauge text lives inside the SVG, so it can never drift out of the arc. */
    .gauge { display:block; width:270px; max-width:100%; margin:0 auto; }
    .gauge .val { font-size:46px; font-weight:750; fill:var(--ink); }
    .gauge .band { font-size:14px; font-weight:600; letter-spacing:.02em; }
    .gauge .end { font-size:11px; fill:var(--faint); }

    .verdict { text-align:center; font-size:1.02rem; line-height:1.5; color:#3d4d5c;
               margin:1rem auto 0; max-width:30rem; }

    .lights { display:grid; grid-template-columns:repeat(3,1fr); gap:.65rem; margin:1.6rem 0 0; }
    .light { border:1px solid var(--line); border-radius:12px; padding:.85rem .5rem .7rem;
             text-align:center; }
    .light .dot { width:11px; height:11px; border-radius:50%; margin:0 auto .45rem;
                  background:#c6d2dc; box-shadow:0 0 0 4px #f1f5f8; }
    .light.ok .dot      { background:var(--green); box-shadow:0 0 0 4px #e8f5ee; }
    .light.suspect .dot { background:var(--amber); box-shadow:0 0 0 4px #fbf1de; }
    .light .n { font-size:.82rem; font-weight:600; line-height:1.25; }
    .light .s { font-size:.72rem; color:var(--mute); margin-top:.15rem; }

    .rule { border:0; border-top:1px solid var(--line); margin:1.6rem 0 1.1rem; }
    .comps-h { font-size:.72rem; letter-spacing:.09em; text-transform:uppercase;
               color:var(--faint); margin:0 0 .7rem; }
    .comp { display:grid; grid-template-columns:8.2rem 1fr 2.6rem; align-items:center;
            gap:.7rem; margin:.5rem 0; }
    .comp .cn { font-size:.85rem; color:#41525f; }
    .comp .cn small { display:block; color:var(--faint); font-size:.72rem; }
    .comp .cbw { background:var(--track); border-radius:99px; height:8px; overflow:hidden; }
    .comp .cb { display:block; height:100%; border-radius:99px; background:var(--green);
                transition:width .5s ease; }
    .comp .cb.mid { background:var(--amber); } .comp .cb.low { background:var(--red); }
    .comp .cv { font-size:.88rem; font-weight:650; text-align:right; }

    footer { display:flex; justify-content:space-between; align-items:center;
             margin:1rem .4rem 0; font-size:.8rem; color:var(--faint); }
    footer a { color:var(--mute); text-decoration:none; }
    footer a:hover { color:var(--ink); }
    .stale { color:var(--red); font-weight:600; }
    @media (max-width:480px){ .card{padding:1.5rem 1.2rem;} .lights{gap:.4rem;} }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="eyebrow" id="window">last 24 hours</p>
      <h1>How is the WiFi doing?</h1>

      <svg class="gauge" viewBox="0 0 220 148" role="img" aria-labelledby="gaugeLabel">
        <title id="gaugeLabel">Overall network health score</title>
        <path d="M22 118 A 88 88 0 0 1 198 118" fill="none" stroke="#eef2f6"
              stroke-width="15" stroke-linecap="round"/>
        <path id="arc" d="M22 118 A 88 88 0 0 1 198 118" fill="none" stroke="#c6d2dc"
              stroke-width="15" stroke-linecap="round" pathLength="100"
              stroke-dasharray="0 100" style="transition:stroke-dasharray .6s ease"/>
        <text id="score" class="val" x="110" y="100" text-anchor="middle">–</text>
        <text id="band"  class="band" x="110" y="128" text-anchor="middle" fill="#65788a">loading…</text>
        <text class="end" x="22" y="140" text-anchor="middle">0</text>
        <text class="end" x="198" y="140" text-anchor="middle">100</text>
      </svg>

      <p class="verdict" id="verdict"></p>
      <div class="lights" id="lights"></div>

      <hr class="rule">
      <p class="comps-h">What the network supports</p>
      <div id="comps"></div>
    </div>
    <footer>
      <span id="updated">…</span>
      <a href="/">Detailed view →</a>
    </footer>
  </main>

  <script>
    // Simple public view over /summary: one score, one sentence, three
    // lights. Everything else lives on the detailed page.
    const SEGS = {
      wifi_link: "Your WiFi",
      internet_path: "Internet path",
      third_party: "The services you use",
    };
    const CAUSE = {
      wifi_link: "The slow part looks like the WiFi link between this device and the router.",
      internet_path: "The WiFi is fine. The path from the router out to the internet is the slow part.",
      third_party: "The network is fine. A service out on the internet is responding slowly.",
    };
    // Component label, the workload its measured value comes from, and a
    // plain-English note about what the score means.
    const COMPS = {
      video:          ["Video streaming", "video",    "startup"],
      web:            ["Web browsing",    "web",      "page load"],
      responsiveness: ["Responsiveness",  null,       "latency under load"],
      download:       ["Downloads",       "download", "throughput"],
      email:          ["Email",           "email",    "fetch"],
    };

    const fmt = (v, unit) => {
      if (v == null) return "";
      if (unit === "ms") return v >= 1000 ? (v / 1000).toFixed(1) + " s" : Math.round(v) + " ms";
      return Math.round(v) + " " + unit;
    };
    const tone = s => s >= 75 ? "" : s >= 50 ? "mid" : "low";
    const colour = s => s == null ? "#c6d2dc"
      : s >= 75 ? "#1f9d57" : s >= 50 ? "#d98a00" : "#d23b3b";

    async function render() {
      let s;
      try { s = await (await fetch("/summary?hours=24")).json(); }
      catch { document.getElementById("band").textContent = "unreachable"; return; }
      const h = s.health || {};

      const arc = document.getElementById("arc");
      arc.setAttribute("stroke-dasharray", `${h.score ?? 0} 100`);
      arc.setAttribute("stroke", colour(h.score));
      document.getElementById("score").textContent = h.score != null ? Math.round(h.score) : "–";
      const band = document.getElementById("band");
      band.textContent = h.label === "no_data" ? "no data yet" : (h.label || "");
      band.setAttribute("fill", colour(h.score));

      document.getElementById("verdict").textContent =
        s.likely_cause ? CAUSE[s.likely_cause] : (s.headline || "");

      document.getElementById("lights").innerHTML = Object.entries(SEGS).map(([k, name]) => {
        const st = (s.segments || {})[k] || "no_data";
        return `<div class="light ${st}"><div class="dot"></div>
          <div class="n">${name}</div>
          <div class="s">${st === "no_data" ? "not measured" : st}</div></div>`;
      }).join("");

      // Heaviest weight first, so the reader sees what matters most.
      const rows = Object.entries(h.components || {})
        .filter(([, v]) => v != null)
        .sort((a, b) => (h.weights?.[b[0]] || 0) - (h.weights?.[a[0]] || 0));
      document.getElementById("comps").innerHTML = rows.map(([k, v]) => {
        const [name, wl, note] = COMPS[k] || [k, null, ""];
        const w = wl && s.workloads?.[wl];
        const measured = w ? fmt(w.value, w.unit) : "";
        const weight = h.weights?.[k] ? ` · ${Math.round(h.weights[k] * 100)}% of score` : "";
        return `<div class="comp" title="${note}${weight}">
          <span class="cn">${name}<small>${measured || note}</small></span>
          <span class="cbw"><span class="cb ${tone(v)}" style="width:${v}%"></span></span>
          <span class="cv">${Math.round(v)}</span></div>`;
      }).join("");

      document.getElementById("updated").textContent =
        "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    render();
    setInterval(render, 60_000);  // keep it fresh on a wall-mounted tab
  </script>
</body>
</html>
