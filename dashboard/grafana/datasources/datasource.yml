# Grafana datasource provisioning. Points at the Timescale/Postgres DB.
apiVersion: 1
datasources:
  - name: WiFi Timescale
    uid: wifi-timescale
    type: postgres
    access: proxy
    url: ${DB_HOST}:5432
    user: wifi
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      # `database` lives in jsonData on current Grafana (top-level is removed)
      database: wifi
      # local compose Postgres has no TLS; set to `require` on Azure
      sslmode: ${DB_SSLMODE}
      postgresVersion: 1600
      timescaledb: true
